<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVE</title>
<link rel="stylesheet" href="/eve-face.css">
<style>
html,body{margin:0;height:100%;background:#060d10;overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none}
#face{position:fixed;inset:0;height:100%}
#cap{position:fixed;left:6vw;right:6vw;bottom:3vh;text-align:center;color:#9adfff;font:600 4.2vh system-ui,"Noto Sans Devanagari",sans-serif;
     opacity:0;transition:opacity .3s;text-shadow:0 0 1vw #000}
#cap.on{opacity:.92}
#off{position:fixed;top:2vh;right:2vw;color:#f66;font:2.4vh monospace;display:none}
#sound-settings{position:fixed;z-index:2;bottom:1vh;right:1vw;color:#9adfff;background:#0b1824;border:1px solid #46718c;border-radius:8px;padding:8px;font:14px system-ui}
#sound-settings button,#sound-settings select{font:inherit}
#sound-settings summary,#face{cursor:pointer}
</style></head><body>
<div id="face"></div>
<details id="sound-settings" hidden><summary>Expression sounds</summary>
<label for="sound-mode">Mode</label>
<select id="sound-mode"><option value="quiet">Quiet</option><option value="natural" selected>Natural</option><option value="playful">Playful</option></select>
<button id="cue-toggle" type="button">Enable sounds</button>
<a href="/expressions" style="color:inherit">Preview all</a>
</details>
<div id="cap"></div><div id="off">no link to EVE</div>
<script src="/eva-face-art.js"></script>
<script src="/eve-face.js"></script>
<script src="/expression-audio.js"></script>
<script>
const face = document.getElementById('face');
const display = EveFace.mount(face);
const cap = document.getElementById('cap'), off = document.getElementById('off');
let misses = 0;
const settings = document.querySelector('#sound-settings');
const mode = document.querySelector('#sound-mode');
const toggle = document.querySelector('#cue-toggle');
let soundsOn = false;
function revealSettings() { settings.hidden = !settings.hidden; }
face.addEventListener('click', revealSettings);
toggle.disabled = true;
EveExpressionAudio.load().then(() => { toggle.disabled = false; }).catch(() => {
  toggle.textContent = 'Sound pack unavailable';
});
toggle.onclick = () => {
  soundsOn = !soundsOn;
  EveExpressionAudio.configure(soundsOn, mode.value);
  toggle.textContent = soundsOn ? 'Mute sounds' : 'Enable sounds';
  settings.open = false;
  settings.hidden = true;
};
mode.onchange = () => EveExpressionAudio.configure(soundsOn, mode.value);
addEventListener('pagehide', () => EveExpressionAudio.stop());
async function poll(){
  try{
    const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(700)});if(!r.ok)throw 0;
    const s=await r.json();misses=0;off.style.display='none';
    display.show(s.expression);
    EveExpressionAudio.update(s);
    cap.textContent=s.caption||'';cap.className=s.caption?'on':'';
    display.look(s.face_offset?.[0] * 6, s.face_offset?.[1] * 5);
  } catch (_) {
    EveExpressionAudio.update(null);
    if (++misses > 4) {
      off.style.display = 'block';
      display.show('sleepy');
      display.look();
    }
  }
  finally { setTimeout(poll, 250); }
}
poll();
</script></body></html>
