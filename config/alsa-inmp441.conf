# Two INMP441s share SD; one L/R=GND, the other L/R=3.3V.
# Keep hardware at 32 bits x 2 slots = 64 clocks/frame.
# ALSA plug converts the stereo capture to EVE's 16 kHz S16_LE mono stream.
# This named PCM does not change the desktop's default playback device.
pcm.eve_mic {
    type plug
    slave {
        pcm "hw:CARD=EVEINMP441,DEV=0"
        format S32_LE
        channels 2
        rate 48000
    }
    route_policy average
}
