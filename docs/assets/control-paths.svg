<g fill="#e3ebf2" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle"><text x="135" y="69">Face / CLI / control</text><text x="400" y="69">Voice / touch</text><text x="665" y="69">ToF / tilt sensors</text><text x="400" y="183">Pi runtime</text><text x="400" y="294">Pi safety gate</text><text x="400" y="410">Mega firmware</text><text x="675" y="410">Cliff / PIR</text><text x="400" y="510">Wheel / head drivers</text></g>
<text x="417" y="351" fill="#a6b7c8" font-family="system-ui,sans-serif" font-size="15">USB serial</text>
