<rect width="800" height="550" rx="16" fill="#101b28"/>
<g fill="#142d3c" stroke="#476477" stroke-width="2"><rect x="20" y="30" width="230" height="65" rx="9"/><rect x="285" y="30" width="230" height="65" rx="9"/><rect x="550" y="30" width="230" height="65" rx="9"/><rect x="270" y="145" width="260" height="65" rx="9"/><rect x="270" y="255" width="260" height="65" rx="9"/><rect x="270" y="370" width="260" height="65" rx="9"/><rect x="570" y="370" width="210" height="65" rx="9"/><rect x="270" y="475" width="260" height="55" rx="9"/></g>
